  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0b1120; --bg2: #0f172a;
      --cyan: #22d3ee; --emerald: #10b981;
      --glass: rgba(255,255,255,0.04); --glass-border: rgba(255,255,255,0.08);
      --text: #e2e8f0; --muted: #64748b;
      --red: #ef4444; --amber: #f59e0b; --purple: #a78bfa;
    }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; overflow-x: hidden; }

    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image:
        linear-gradient(rgba(34,211,238,0.022) 1px, transparent 1px),
        linear-gradient(90deg, rgba(34,211,238,0.022) 1px, transparent 1px);
      background-size: 56px 56px;
    }
    body::after {
      content: ''; position: fixed; top: -200px; left: 50%; transform: translateX(-50%);
      width: 700px; height: 700px; pointer-events: none; z-index: 0;
      background: radial-gradient(circle, rgba(34,211,238,0.055) 0%, transparent 65%);
    }
    #root { position: relative; z-index: 1; }

    /* ── Primitives ── */
    .glass { background: var(--glass); border: 1px solid var(--glass-border); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .label-sm { font-size: 11px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.09em; }
    .card-lg { border-radius: 20px; padding: 26px 22px; }
    .icon-box { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .icon-box.em { background: rgba(16,185,129,0.12); border: 1px solid rgba(16,185,129,0.2); }
    .icon-box.cy { background: rgba(34,211,238,0.12); border: 1px solid rgba(34,211,238,0.2); }

    /* ── Buttons ── */
    .btn-primary { background: linear-gradient(135deg,#22d3ee,#0891b2); color: #0f172a; font-weight: 700; border: none; cursor: pointer; transition: all .2s; font-family: 'Inter',sans-serif; }
    .btn-primary:hover:not(:disabled) { opacity: .88; transform: translateY(-1px); box-shadow: 0 8px 24px rgba(34,211,238,.28); }

    /* ── Inputs ── */
    input, select, textarea { background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); color: var(--text); outline: none; transition: border .2s; font-family: 'Inter',sans-serif; }
    input:focus, select:focus, textarea:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(34,211,238,.1); }
    select option { background: #1e293b; }
    input[type="range"] { -webkit-appearance: none; width: 100%; height: 4px; border-radius: 2px; background: rgba(255,255,255,.12); outline: none; border: none; box-shadow: none; }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--cyan); cursor: pointer; box-shadow: 0 0 6px rgba(34,211,238,.5); }
    input[type="date"] { color-scheme: dark; }
    ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 2px; }

    /* ── Nav ── */
    .nav-rail { position: fixed; bottom: 0; left: 0; right: 0; z-index: 50; background: rgba(11,17,32,0.92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid rgba(255,255,255,0.07); padding: 8px 12px 10px; display: flex; gap: 2px; }
    .nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px; border-radius: 12px; border: none; cursor: pointer; transition: all .2s; font-family: 'Inter',sans-serif; font-size: 10px; font-weight: 600; background: transparent; color: var(--muted); position: relative; }
    .nav-btn.active { color: var(--cyan); background: rgba(34,211,238,0.08); }
    .nav-btn .dot { position: absolute; top: 6px; right: calc(50% - 14px); width: 5px; height: 5px; border-radius: 50%; background: var(--red); animation: live-pulse 2s infinite; }

    /* ── Animations ── */
    @keyframes shimmer { 0%{background-position:-200% center} 100%{background-position:200% center} }

// Shared constants, data, and utility functions

const POD_PRICE = 8;
const PUFFS_PER_POD = 600;

function pad(n) { return String(Math.floor(n)).padStart(2, '0'); }

function getElapsed(startTs) {
  const diff = Math.max(0, Date.now() - startTs);
  const totalSec = Math.floor(diff / 1000);
  const days = Math.floor(totalSec / 86400);
  const hours = Math.floor((totalSec % 86400) / 3600);
  const mins = Math.floor((totalSec % 3600) / 60);
  const secs = totalSec % 60;
  return { days, hours, mins, secs, totalSec };
}

function getMoneySaved(totalSec, podsPerWeek) {
  return totalSec * (podsPerWeek * POD_PRICE) / (7 * 24 * 3600);
}

function getHealthMetrics(totalSec) {
  const h = totalSec / 3600;
  const d = totalSec / 86400;
  const o2 = Math.min(100, h < 8 ? 60 + (h/8)*20 : 80 + (d/30)*20);
  const dopa = Math.min(100, d < 7 ? 25 + (d/7)*25 : 50 + ((d-7)/53)*50);
  const lung = Math.min(100, d < 30 ? 50 + (d/30)*30 : 80 + ((d-30)/60)*20);
  const immune = Math.min(100, d < 14 ? 40 + (d/14)*20 : 60 + ((d-14)/166)*40);
  return {
    o2: Math.round(o2),
    dopa: Math.round(dopa),
    lung: Math.round(lung),
    immune: Math.round(immune),
  };
}

const { useState: useState_tl } = React;

function RecoveryTimeline({ elapsed }) {
  const [expanded, setExpanded_tl] = useState_tl(null);
  const daysElapsed = elapsed.totalSec / 86400;

  const unlocked = MILESTONES.filter(m => daysElapsed >= m.days);
  const locked = MILESTONES.filter(m => daysElapsed < m.days);
  const nextMilestone = locked[0];
  const daysToNext = nextMilestone ? nextMilestone.days - daysElapsed : null;

  function formatEta(days) {
    if (days < 1/24) return `${Math.ceil(days*1440)} min`;
    if (days < 1) return `${Math.ceil(days*24)} horas`;
    if (days < 7) return `${Math.ceil(days)} días`;
    if (days < 30) return `${Math.ceil(days/7)} semanas`;
    return `${Math.ceil(days/30)} meses`;
  }

  return (
    <div>
      {/* Next milestone banner */}
      {nextMilestone && (
        <div className="glass" style={{ borderRadius: 16, padding: '18px 22px', marginBottom: 24, display: 'flex', alignItems: 'center', gap: 16, background: `${nextMilestone.color}08`, border: `1px solid ${nextMilestone.color}22` }}>
          <div style={{ width: 44, height: 44, borderRadius: 12, background: `${nextMilestone.color}18`, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
            <Icon name={nextMilestone.icon} size={22} color={nextMilestone.color} />
          </div>
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 11, color: nextMilestone.color, fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.08em', marginBottom: 2 }}>
              Próximo hito — {nextMilestone.label}
            </div>
            <div style={{ fontSize: 15, fontWeight: 600 }}>{nextMilestone.title}</div>
          </div>
          <div style={{ textAlign: 'right', flexShrink: 0 }}>
            <div className="mono" style={{ fontSize: 22, fontWeight: 700, color: nextMilestone.color }}>{formatEta(daysToNext)}</div>
            <div style={{ fontSize: 11, color: 'var(--muted)' }}>para lograrlo</div>
          </div>
        </div>
      )}

      {/* Timeline */}
      <div style={{ position: 'relative' }}>
        {/* Vertical line */}
        <div style={{ position: 'absolute', left: 20, top: 0, bottom: 0, width: 2, background: 'rgba(255,255,255,0.06)', borderRadius: 1 }} />
        <div style={{ position: 'absolute', left: 20, top: 0, width: 2, background: `linear-gradient(to bottom, var(--cyan), var(--emerald))`, borderRadius: 1, height: `${Math.min(100, (unlocked.length / MILESTONES.length) * 100)}%`, transition: 'height 1s ease' }} />

        <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
          {MILESTONES.map((m, i) => {
            const isUnlocked = daysElapsed >= m.days;
            const isNext = m === nextMilestone;
            const isExpanded = expanded === i;
            return (
              <div key={i}>
                <button
                  onClick={() => setExpanded_tl(isExpanded ? null : i)}
                  style={{ width: '100%', background: 'none', border: 'none', cursor: 'pointer', textAlign: 'left', padding: 0 }}
                >
                  <div style={{
                    display: 'flex', alignItems: 'center', gap: 16, padding: '14px 14px 14px 0',
                    opacity: isUnlocked ? 1 : 0.45, transition: 'opacity .3s',
                  }}>
                    {/* Node */}
                    <div style={{
                      width: 40, height: 40, borderRadius: '50%', flexShrink: 0, zIndex: 1,
                      background: isUnlocked ? `${m.color}20` : 'rgba(255,255,255,0.04)',
                      border: `2px solid ${isUnlocked ? m.color : 'rgba(255,255,255,0.1)'}`,
                      display: 'flex', alignItems: 'center', justifyContent: 'center',
                      boxShadow: isUnlocked ? `0 0 12px ${m.color}40` : 'none',
                      transition: 'all .4s',
                    }}>
                      <Icon name={isUnlocked ? m.icon : 'clock'} size={16} color={isUnlocked ? m.color : 'var(--muted)'} />
                    </div>

                    <div style={{ flex: 1 }}>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 2 }}>
                        <span style={{ fontSize: 12, color: isUnlocked ? m.color : 'var(--muted)', fontWeight: 700, fontFamily: 'JetBrains Mono, monospace' }}>{m.label}</span>
                        {isNext && <span style={{ fontSize: 10, padding: '2px 7px', borderRadius: 10, background: `${m.color}18`, color: m.color, fontWeight: 700 }}>PRÓXIMO</span>}
                        {isUnlocked && <span style={{ fontSize: 10, padding: '2px 7px', borderRadius: 10, background: 'rgba(16,185,129,0.15)', color: 'var(--emerald)', fontWeight: 700 }}>✓ ALCANZADO</span>}
                      </div>
                      <div style={{ fontSize: 14, fontWeight: 600, color: isUnlocked ? 'var(--text)' : 'var(--muted)' }}>{m.title}</div>
                    </div>

                    <Icon name="chevron-right" size={14} color="var(--muted)"
                      style={{ transform: isExpanded ? 'rotate(90deg)' : 'none', transition: 'transform .2s' }} />
                  </div>
                </button>

                {/* Expanded detail */}
                {isExpanded && (
                  <div style={{ marginLeft: 56, marginBottom: 8, padding: '14px 16px', borderRadius: 12, background: 'rgba(255,255,255,0.03)', borderLeft: `2px solid ${m.color}50` }}>

                    </div>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

const { useState: useState_sos, useEffect: useEffect_sos, useRef: useRef_sos } = React;

// ── Breathing 4-7-8 ──────────────────────────────────────────────────────────
const BREATH_PHASES = [
  { label: 'Inhala', duration: 4000, scale: 1.3, color: '#22d3ee' },
  { label: 'Retén', duration: 7000, scale: 1.3, color: '#a78bfa' },
  { label: 'Exhala', duration: 8000, scale: 0.7, color: '#10b981' },
];

function BreathingTechnique() {
  const [phase, setPhase_b] = useState_sos(0);
  const [cycle, setCycle_b] = useState_sos(0);
  const [ms, setMs_b] = useState_sos(BREATH_PHASES[0].duration);
  const phaseRef = useRef_sos(0);
  const msRef = useRef_sos(BREATH_PHASES[0].duration);

  useEffect_sos(() => {
    const id = setInterval(() => {
      msRef.current -= 200;
      setMs_b(msRef.current);
      if (msRef.current <= 0) {
        const next = (phaseRef.current + 1) % BREATH_PHASES.length;
        phaseRef.current = next;
        setPhase_b(next);
        msRef.current = BREATH_PHASES[next].duration;
        setMs_b(msRef.current);
        if (next === 0) setCycle_b(c => c + 1);
      }
    }, 200);
    return () => clearInterval(id);
  }, []);

  const cur = BREATH_PHASES[phase];
  const timeLeft = Math.ceil(ms / 1000);
  const sphereAnim = cur.scale > 1
    ? `breathe-in ${cur.duration}ms ease-in-out forwards`
    : `breathe-out ${cur.duration}ms ease-in-out forwards`;

  return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 32 }}>
      <div style={{ fontSize: 12, color: 'var(--muted)', fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.1em' }}>
        Ciclo {cycle + 1} · Técnica 4-7-8
      </div>
      <div style={{ position: 'relative', width: 180, height: 180, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        <div style={{
          width: 160, height: 160, borderRadius: '50%',
          background: `radial-gradient(circle at 35% 35%, ${cur.color}80, ${cur.color}18)`,
          boxShadow: `0 0 40px ${cur.color}40`,
          animation: sphereAnim,
        }} />
        <div style={{ position: 'absolute', textAlign: 'center' }}>
          <div style={{ fontSize: 13, color: cur.color, fontWeight: 800, textTransform: 'uppercase', letterSpacing: '0.1em' }}>{cur.label}</div>
          <div className="mono" style={{ fontSize: 36, fontWeight: 700, color: 'white', lineHeight: 1 }}>{timeLeft}</div>
        </div>
      </div>
      <div style={{ display: 'flex', gap: 8 }}>
        {BREATH_PHASES.map((p, i) => (
          <div key={i} style={{ height: 3, width: i === phase ? 40 : 12, borderRadius: 9999, background: i === phase ? cur.color : 'rgba(255,255,255,0.1)', transition: 'all .4s' }} />
        ))}
      </div>
      <div className="glass" style={{ maxWidth: 440, width: '100%', borderRadius: 14, padding: '18px 22px', borderLeft: '3px solid var(--cyan)' }}>
        <p style={{ fontSize: 14, lineHeight: 1.7, color: 'var(--muted)' }}>
          La técnica 4-7-8 activa el <strong style={{ color: 'var(--text)' }}>nervio vago</strong> y reduce el cortisol en 90 segundos. Desarrollada por el Dr. Andrew Weil basándose en el pranayama yóguico.
        </p>
      </div>
    </div>
  );
}

const GROUNDING_STEPS = [
  { count: 5, sense: 'VER', prompt: 'Nombra 5 cosas que puedes ver ahora mismo', icon: 'eye', color: '#a78bfa' },
  { count: 4, sense: 'OÍR', prompt: 'Nombra 4 sonidos que puedes escuchar', icon: 'music', color: '#22d3ee' },
  { count: 3, sense: 'TOCAR', prompt: 'Nombra 3 texturas que puedes sentir', icon: 'hand-metal', color: '#10b981' },
  { count: 2, sense: 'OLER', prompt: 'Nombra 2 olores que percibes o recuerdas', icon: 'wind', color: '#f59e0b' },
  { count: 1, sense: 'SABOREAR', prompt: 'Nombra 1 sabor en tu boca ahora mismo', icon: 'sparkles', color: '#f43f5e' },
];

function GroundingTechnique() {
  const [step, setStep_g] = useState_sos(0);
  const [checked, setChecked_g] = useState_sos([]);
  const [done, setDone_g] = useState_sos(false);
  const cur = GROUNDING_STEPS[step];

  function toggleCheck(i) {
    setChecked_g(prev => prev.includes(i) ? prev.filter(x => x !== i) : [...prev, i]);
  }
  function nextStep() {
    if (step < GROUNDING_STEPS.length - 1) { setStep_g(s => s + 1); setChecked_g([]); }
    else setDone_g(true);
  }

  if (done) return (
    <div style={{ textAlign: 'center', padding: '40px 20px' }}>
      <div style={{ fontSize: 48, marginBottom: 16 }}>🌊</div>
      <h3 style={{ fontSize: 22, fontWeight: 700, marginBottom: 8 }}>Grounding completado</h3>
      <p style={{ color: 'var(--muted)', fontSize: 15, lineHeight: 1.7, maxWidth: 380, margin: '0 auto' }}>
        Has llevado tu mente al presente. El antojo ha perdido fuerza. Estás aquí. Estás bien.
      </p>
    </div>
  );

  return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 24, maxWidth: 500, margin: '0 auto', width: '100%' }}>
      <div style={{ display: 'flex', gap: 8, marginBottom: 8 }}>
        {GROUNDING_STEPS.map((s, i) => (
          <div key={i} style={{ width: i === step ? 32 : 8, height: 8, borderRadius: 9999, background: i < step ? 'var(--emerald)' : i === step ? cur.color : 'rgba(255,255,255,0.1)', transition: 'all .4s' }} />
        ))}
      </div>
      <div style={{ width: 72, height: 72, borderRadius: '50%', background: `${cur.color}18`, border: `2px solid ${cur.color}40`, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        <Icon name={cur.icon} size={32} color={cur.color} />
      </div>
      <div style={{ textAlign: 'center' }}>
        <div style={{ fontSize: 11, color: cur.color, fontWeight: 800, letterSpacing: '0.12em', textTransform: 'uppercase', marginBottom: 6 }}>{cur.count} cosas que puedes {cur.sense}</div>
        <p style={{ fontSize: 16, color: 'var(--text)', lineHeight: 1.5 }}>{cur.prompt}</p>
      </div>
      <div style={{ width: '100%', display: 'flex', flexDirection: 'column', gap: 8 }}>
        {Array.from({ length: cur.count }).map((_, i) => (
          <button key={i} onClick={() => toggleCheck(i)} style={{
            display: 'flex', alignItems: 'center', gap: 12, padding: '12px 16px', borderRadius: 10,
            background: checked.includes(i) ? `${cur.color}12` : 'rgba(255,255,255,0.03)',
            border: `1px solid ${checked.includes(i) ? cur.color : 'rgba(255,255,255,0.08)'}`,
            cursor: 'pointer', transition: 'all .2s', textAlign: 'left', color: 'var(--text)', fontSize: 14,
          }}>
            <div style={{ width: 20, height: 20, borderRadius: 6, border: `2px solid ${checked.includes(i) ? cur.color : 'rgba(255,255,255,0.2)'}`, background: checked.includes(i) ? cur.color : 'transparent', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0, transition: 'all .2s' }}>
              {checked.includes(i) && <Icon name="check-circle" size={12} color="#0f172a" />}
            </div>
            <span style={{ color: checked.includes(i) ? 'var(--text)' : 'var(--muted)' }}>#{i + 1}</span>
          </button>
        ))}
      </div>
      <button className="btn-primary" onClick={nextStep} disabled={checked.length < cur.count} style={{
        padding: '12px 32px', borderRadius: 12, fontSize: 15, opacity: checked.length < cur.count ? 0.4 : 1,
        cursor: checked.length < cur.count ? 'not-allowed' : 'pointer',
      }}>
        {step < GROUNDING_STEPS.length - 1 ? `Siguiente sentido →` : 'Completar ejercicio'}
      </button>
    </div>
  );
}

const SURF_PHASES = [
  { label: 'Observa', dur: 60, text: 'Cierra los ojos. Localiza el antojo en tu cuerpo. ¿Dónde lo sientes? ¿En el pecho? ¿En la garganta? Solo obsérvalo. No lo luches.' },
  { label: 'La ola sube', dur: 90, text: 'El antojo está creciendo. Eso es normal. No significa que debas actuar. Tú eres el cielo. El antojo es solo una nube pasando.' },
  { label: 'El pico', dur: 60, text: 'Estás en el pico de la ola. Este es el momento más intenso. Sigue respirando. No va a durar. Ninguna ola dura para siempre.' },
  { label: 'Desciende', dur: 90, text: 'La ola está bajando. Puedes sentir cómo disminuye. No tuviste que hacer nada para que ocurriera. Solo esperar. Eso es la libertad.' },
];

function UrgeSurfingTechnique() {
  const [phase, setPhase_us] = useState_sos(0);
  const [secs, setSecs_us] = useState_sos(SURF_PHASES[0].dur);
  const [done, setDone_us] = useState_sos(false);
  const [running, setRunning_us] = useState_sos(false);
  const phaseRef = useRef_sos(0);
  const secsRef = useRef_sos(SURF_PHASES[0].dur);

  useEffect_sos(() => {
    if (!running) return;
    const id = setInterval(() => {
      secsRef.current -= 1;
      setSecs_us(secsRef.current);
      if (secsRef.current <= 0) {
        const next = phaseRef.current + 1;
        if (next >= SURF_PHASES.length) { setDone_us(true); setRunning_us(false); }
        else {
          phaseRef.current = next;
          setPhase_us(next);
          secsRef.current = SURF_PHASES[next].dur;
          setSecs_us(secsRef.current);
        }
      }
    }, 1000);
    return () => clearInterval(id);
  }, [running]);

  const cur = SURF_PHASES[phase];
  const totalDur = SURF_PHASES.reduce((a, p) => a + p.dur, 0);
  const elapsed_us = SURF_PHASES.slice(0, phase).reduce((a, p) => a + p.dur, 0) + (cur.dur - secs);
  const pct = (elapsed_us / totalDur) * 100;

  if (done) return (
    <div style={{ textAlign: 'center', padding: '40px 20px' }}>
      <div style={{ fontSize: 48, marginBottom: 16 }}>🌊</div>
      <h3 style={{ fontSize: 22, fontWeight: 700, marginBottom: 8 }}>Ola superada</h3>
      <p style={{ color: 'var(--muted)', fontSize: 15, lineHeight: 1.7, maxWidth: 380, margin: '0 auto' }}>
        El antojo pasó. Siempre pasa. Acabas de demostrar que puedes dejarlo pasar sin actuar sobre él.
      </p>
    </div>
  );

  return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 24, maxWidth: 480, margin: '0 auto', width: '100%' }}>
      {/* Wave progress */}
      <div style={{ width: '100%', height: 60, position: 'relative', marginBottom: 8 }}>
        <svg width="100%" height="60" viewBox="0 0 400 60" preserveAspectRatio="none" style={{ position: 'absolute', inset: 0 }}>
          <defs>
            <linearGradient id="waveGrad" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stopColor="#22d3ee" stopOpacity="0.3" />
              <stop offset={`${pct}%`} stopColor="#10b981" stopOpacity="0.8" />
              <stop offset={`${pct}%`} stopColor="#10b981" stopOpacity="0.1" />
              <stop offset="100%" stopColor="#10b981" stopOpacity="0.1" />
            </linearGradient>
          </defs>
          <path d="M0 40 Q50 10 100 35 Q150 55 200 30 Q250 5 300 35 Q350 55 400 25 L400 60 L0 60 Z" fill="url(#waveGrad)" />
        </svg>
        <div style={{ position: 'absolute', bottom: 8, left: `${Math.min(92, pct)}%`, transform: 'translateX(-50%)' }}>
          <div style={{ width: 8, height: 8, borderRadius: '50%', background: '#10b981', boxShadow: '0 0 8px #10b981' }} />
        </div>
      </div>

      <div style={{ textAlign: 'center' }}>
        <div style={{ fontSize: 12, color: '#10b981', fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.1em', marginBottom: 8 }}>{cur.label}</div>
        <p style={{ fontSize: 16, lineHeight: 1.8, color: 'var(--text)', maxWidth: 400 }}>{cur.text}</p>
      </div>

      <div className="mono" style={{ fontSize: 48, fontWeight: 700, color: '#10b981' }}>{secs}<span style={{ fontSize: 20, color: 'var(--muted)' }}>s</span></div>

      {!running
        ? <button className="btn-primary" onClick={() => setRunning_us(true)} style={{ padding: '12px 32px', borderRadius: 12, fontSize: 15 }}>Empezar a surfear</button>
        : <div style={{ fontSize: 13, color: 'var(--muted)', textAlign: 'center' }}>Técnica de Alan Marlatt · Mindfulness-Based Relapse Prevention</div>
      }
    </div>
  );
}

function CBTThoughtRecord({ onBack }) {
  const [step, setStep_cbt] = useState_cbt(0);
  const [answers, setAnswers_cbt] = useState_cbt({});
  const [done, setDone_cbt] = useState_cbt(false);
  const [saved, setSaved_cbt] = useState_cbt([]);

  const cur = CBT_STEPS[step];
  const isLast = step === CBT_STEPS.length - 1;

  function next() {
    if (isLast) {
      const record = { id: Date.now(), ts: Date.now(), ...answers };
      const prev = (() => { try { return JSON.parse(localStorage.getItem('vf_cbt')) || []; } catch { return []; } })();
      const all = [record, ...prev].slice(0, 20);
      localStorage.setItem('vf_cbt', JSON.stringify(all));
      setSaved_cbt(all);
      setDone_cbt(true);
    } else {
      setStep_cbt(s => s + 1);
    }
  }

  function canProceed() {
    if (cur.type === 'distortion') return !!answers.distortion;
    return !!(answers[cur.id] || '').trim();
  }

  if (done) return (
    <div style={{ maxWidth: 500, margin: '0 auto', textAlign: 'center', padding: '32px 20px' }}>
      <div style={{ fontSize: 48, marginBottom: 16 }}>🧠</div>
      <h3 style={{ fontSize: 22, fontWeight: 700, marginBottom: 10 }}>Registro CBT completado</h3>
      <p style={{ color: 'var(--muted)', fontSize: 14, lineHeight: 1.7, marginBottom: 24, maxWidth: 380, margin: '0 auto 24px' }}>
        Has identificado el pensamiento distorsionado y lo has reformulado. Ese proceso es exactamente lo que hace la Terapia Cognitivo-Conductual (CBT) en consulta.
      </p>
      <div className="glass" style={{ borderRadius: 16, padding: '20px', textAlign: 'left', borderLeft: '3px solid var(--emerald)', marginBottom: 20 }}>
        <div className="label-sm" style={{ marginBottom: 8 }}>Tu pensamiento equilibrado</div>
        <p style={{ fontSize: 15, lineHeight: 1.7, color: 'var(--text)', fontStyle: 'italic' }}>"{answers.balanced}"</p>
      </div>
      <button className="btn-primary" onClick={onBack} style={{ padding: '12px 32px', borderRadius: 12, fontSize: 15 }}>
        Volver al SOS
      </button>
    </div>
  );

  const pct = ((step) / CBT_STEPS.length) * 100;

  return (
    <div style={{ maxWidth: 520, margin: '0 auto' }}>
      {/* Progress bar */}
      <div style={{ height: 4, borderRadius: 9999, background: 'rgba(255,255,255,0.06)', overflow: 'hidden', marginBottom: 28 }}>
        <div style={{ width: `${pct}%`, height: '100%', background: 'linear-gradient(90deg,var(--cyan),var(--emerald))', borderRadius: 9999, transition: 'width .4s ease' }} />
      </div>

      <div style={{ marginBottom: 28 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 12 }}>
          <div style={{ width: 28, height: 28, borderRadius: 8, background: 'rgba(34,211,238,0.15)', border: '1px solid rgba(34,211,238,0.3)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
            <span style={{ fontSize: 12, fontWeight: 700, color: 'var(--cyan)' }}>{step + 1}</span>
          </div>
          <span className="label-sm" style={{ color: 'var(--cyan)' }}>{cur.label}</span>
          <span style={{ marginLeft: 'auto', fontSize: 11, color: 'var(--muted)' }}>{step + 1}/{CBT_STEPS.length}</span>
        </div>
        <h3 style={{ fontSize: 17, fontWeight: 700, lineHeight: 1.5, marginBottom: 6 }}>{cur.question}</h3>
      </div>

      {cur.type === 'text' && (
        <textarea
          value={answers[cur.id] || ''}
          onChange={e => setAnswers_cbt(a => ({...a, [cur.id]: e.target.value}))}
          placeholder={cur.placeholder}
          rows={4}
          autoFocus
          style={{ width: '100%', padding: '14px 16px', borderRadius: 14, fontSize: 14, resize: 'none', border: '1px solid rgba(255,255,255,0.1)', background: 'rgba(255,255,255,0.04)', color: 'var(--text)', fontFamily: 'Inter,sans-serif', outline: 'none', lineHeight: 1.6, transition: 'border .2s' }}
          onFocus={e => { e.target.style.border = '1px solid var(--cyan)'; e.target.style.boxShadow = '0 0 0 3px rgba(34,211,238,0.1)'; }}
          onBlur={e => { e.target.style.border = '1px solid rgba(255,255,255,0.1)'; e.target.style.boxShadow = 'none'; }}
        />
      )}

      {cur.type === 'distortion' && (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
          {DISTORTIONS.map(d => (
            <button key={d.id} onClick={() => setAnswers_cbt(a => ({...a, distortion: d.id}))} style={{
              textAlign: 'left', padding: '14px 16px', borderRadius: 12, cursor: 'pointer', transition: 'all .2s',
              background: answers.distortion === d.id ? 'rgba(34,211,238,0.1)' : 'rgba(255,255,255,0.03)',
              border: `1px solid ${answers.distortion === d.id ? 'var(--cyan)' : 'rgba(255,255,255,0.08)'}`,
              fontFamily: 'Inter,sans-serif',
            }}>
              <div style={{ fontSize: 14, fontWeight: 600, color: answers.distortion === d.id ? 'var(--cyan)' : 'var(--text)', marginBottom: 2 }}>{d.label}</div>
              <div style={{ fontSize: 12, color: 'var(--muted)' }}>{d.example}</div>
            </button>
          ))}
        </div>
      )}

      {/* Previous answer preview */}
      {step > 0 && answers[CBT_STEPS[step - 1].id] && cur.type !== 'distortion' && (
        <div style={{ marginTop: 14, padding: '10px 14px', borderRadius: 10, background: 'rgba(255,255,255,0.03)', border: '1px solid rgba(255,255,255,0.06)' }}>
          <div style={{ fontSize: 11, color: 'var(--muted)', marginBottom: 4 }}>{CBT_STEPS[step - 1].label}:</div>
          <p style={{ fontSize: 12, color: 'var(--text)', lineHeight: 1.5, fontStyle: 'italic' }}>"{answers[CBT_STEPS[step - 1].id]}"</p>
        </div>
      )}

      <div style={{ display: 'flex', gap: 8, marginTop: 24 }}>
        {step > 0 && (
          <button className="btn-ghost" onClick={() => setStep_cbt(s => s - 1)} style={{ padding: '13px 20px', borderRadius: 12, fontSize: 15 }}>
            ←
          </button>
        )}
        <button className="btn-primary" onClick={next} disabled={!canProceed()} style={{ flex: 1, padding: '13px', borderRadius: 12, fontSize: 15, opacity: !canProceed() ? 0.4 : 1, cursor: !canProceed() ? 'not-allowed' : 'pointer' }}>
          {isLast ? 'Completar registro ✓' : 'Siguiente →'}
        </button>
      </div>

      <div style={{ marginTop: 20, padding: '14px', borderRadius: 12, background: 'rgba(255,255,255,0.02)', border: '1px solid rgba(255,255,255,0.05)' }}>
        <p style={{ fontSize: 11, color: 'var(--muted)', lineHeight: 1.6, textAlign: 'center' }}>
          Técnica central de la <strong style={{ color: 'var(--text)' }}>Terapia Cognitivo-Conductual (CBT)</strong> de Aaron Beck. Duplica las tasas de cesación vs no tratamiento. — Cochrane Systematic Review 2019
        </p>
      </div>
    </div>
  );
}

const { useState: useState_j, useMemo: useMemo_j } = React;

function CravingJournal({ entries, setEntries }) {
  const [showForm, setShowForm_j] = useState_j(false);
  const [form, setForm_j] = useState_j({ intensity: 5, trigger: '', technique: '', outcome: 'resisted', note: '' });

  function save() {
    if (!form.trigger || !form.technique) return;
    const entry = { id: Date.now(), ts: Date.now(), ...form, intensity: Number(form.intensity) };
    const next = [entry, ...entries];
    setEntries(next);
    localStorage.setItem('vf_cravings', JSON.stringify(next));
    setShowForm_j(false);
    setForm_j({ intensity: 5, trigger: '', technique: '', outcome: 'resisted', note: '' });
  }

  function remove(id) {
    const next = entries.filter(e => e.id !== id);
    setEntries(next);
    localStorage.setItem('vf_cravings', JSON.stringify(next));
  }

  // Trigger frequency map
  const triggerStats = useMemo_j(() => {
    const map = {};
    entries.forEach(e => { map[e.trigger] = (map[e.trigger] || 0) + 1; });
    return Object.entries(map).sort((a, b) => b[1] - a[1]);
  }, [entries]);

  const resisted = entries.filter(e => e.outcome === 'resisted').length;
  const total = entries.length;
  const avgIntensity = total ? (entries.reduce((a, e) => a + e.intensity, 0) / total).toFixed(1) : '—';

  const techniques = [
    { id: 'breathing', label: 'Respiración 4-7-8' },

            </div>

      {/* Trigger chart */}
      {triggerStats.length > 0 && (
        <div className="glass" style={{ borderRadius: 16, padding: '18px 20px', marginBottom: 20 }}>

            {triggerStats.map(([tid, count]) => {

  const [input, setInput_r] = useState_r('');

  function add(text) {
    if (!text.trim() || reasons.includes(text.trim())) return;
    const next = [...reasons, text.trim()];
    setReasons(next);
    localStorage.setItem('vf_reasons', JSON.stringify(next));
    setInput_r('');
  }

  function remove(r) {
    const next = reasons.filter(x => x !== r);
    setReasons(next);
    localStorage.setItem('vf_reasons', JSON.stringify(next));
  }

  const available = REASON_SUGGESTIONS.filter(s => !reasons.includes(s.text));

  return (
    <div>
      <div style={{ marginBottom: 20 }}>
        <p style={{ fontSize: 14, color: 'var(--muted)', lineHeight: 1.7, marginBottom: 16 }}>
          Investigación de Peter Gollwitzer (1999) demuestra que escribir tus razones con claridad aumenta la adherencia al cambio un <strong style={{ color: 'var(--text)' }}>40%</strong>. Estas son tuyas. Léelas cuando el antojo llegue.
        </p>

        {/* Custom input */}
        <div style={{ display: 'flex', gap: 8, marginBottom: 16 }}>
          <input
            type="text" value={input} onChange={e => setInput_r(e.target.value)}
            onKeyDown={e => e.key === 'Enter' && add(input)}
            placeholder="Escribe tu razón personal..."
            style={{ flex: 1, padding: '11px 14px', borderRadius: 10, fontSize: 14 }}
          />
          <button className="btn-primary" onClick={() => add(input)} style={{ padding: '11px 18px', borderRadius: 10, fontSize: 14, flexShrink: 0 }}>
            <Icon name="plus" size={18} color="#0f172a" />
          </button>
        </div>

        {/* Suggestions */}
        {available.length > 0 && (
          <div>
            <div className="label-sm" style={{ marginBottom: 10 }}>Sugerencias (toca para añadir)</div>
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8 }}>
              {available.map(s => (
                <button key={s.text} onClick={() => add(s.text)} style={{
                  display: 'flex', alignItems: 'center', gap: 6, padding: '7px 12px', borderRadius: 8, fontSize: 13, cursor: 'pointer', transition: 'all .15s',
                  background: 'rgba(255,255,255,0.04)', border: '1px solid rgba(255,255,255,0.1)', color: 'var(--muted)',
                }}
                  onMouseEnter={e => { e.currentTarget.style.borderColor = 'var(--cyan)'; e.currentTarget.style.color = 'var(--cyan)'; }}
                  onMouseLeave={e => { e.currentTarget.style.borderColor = 'rgba(255,255,255,0.1)'; e.currentTarget.style.color = 'var(--muted)'; }}
                >
                  <Icon name={s.icon} size={13} />
                  {s.text}
                </button>
              ))}
            </div>
          </div>
        )}
      </div>

      {/* Reasons list */}
      {reasons.length === 0 ? (
        <div style={{ textAlign: 'center', padding: '40px 20px', color: 'var(--muted)' }}>
          <div style={{ fontSize: 36, marginBottom: 12 }}>❤️</div>
          <p style={{ fontSize: 15, lineHeight: 1.7 }}>Todavía no has escrito tus razones.<br />Son tu ancla cuando el antojo llega.</p>
        </div>
      ) : (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
          {reasons.map((r, i) => {
            const suggestion = REASON_SUGGESTIONS.find(s => s.text === r);
            return (
              <div key={i} className="glass" style={{ borderRadius: 14, padding: '16px 18px', display: 'flex', alignItems: 'center', gap: 14, borderLeft: '3px solid var(--cyan)' }}>
                <div style={{ width: 36, height: 36, borderRadius: 10, background: 'rgba(34,211,238,0.1)', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
                  <Icon name={suggestion?.icon || 'heart'} size={18} color="var(--cyan)" />
                </div>
                <p style={{ flex: 1, fontSize: 14, color: 'var(--text)', lineHeight: 1.5 }}>{r}</p>
                <button className="btn-ghost icon-btn" onClick={() => remove(r)} style={{ opacity: 0.4, width: 28, height: 28, borderRadius: 7 }}>
                  <Icon name="trash" size={13} />
                </button>
              </div>
            );
          })}
        </div>
      )}

      {reasons.length >= 3 && (
        <div className="glass" style={{ borderRadius: 14, padding: '16px 20px', marginTop: 20, borderLeft: '3px solid var(--emerald)' }}>
          <p style={{ fontSize: 13, color: 'var(--muted)', lineHeight: 1.7 }}>
            <strong style={{ color: 'var(--emerald)' }}>Consejo ACT:</strong> Cuando llegue un antojo, elige una de tus razones y dite en voz alta: <em>"Elijo no vapear porque {reasons[0]?.toLowerCase()}"</em>. La elección activa diferente que la supresión.
          </p>
        </div>
      )}
    </div>
  );
}

const { useState: useState_ci, useEffect: useEffect_ci, useMemo: useMemo_ci } = React;

// Daily check-in: mood + sleep + energy + commitment
// Evidence: Daily self-monitoring → strongest predictor of cessation success (Cochrane 2019)

const MOODS = [
  { id: 1, label: 'Muy mal', icon: 'frown',  color: '#ef4444' },
  { id: 2, label: 'Mal',     icon: 'frown',  color: '#f97316' },
  { id: 3, label: 'Regular', icon: 'meh',    color: '#f59e0b' },
  { id: 4, label: 'Bien',    icon: 'smile',  color: '#10b981' },
  { id: 5, label: 'Genial',  icon: 'sparkles', color: '#22d3ee' },
];

const MOOD_EMOJIS = ['', '😞', '😕', '😐', '🙂', '😊'];

function todayKey() {
  return new Date().toISOString().slice(0, 10);
}

function CheckinPanel({ checkins, setCheckins }) {
  const today = todayKey();
  const todayEntry = checkins.find(c => c.date === today);
  const [step, setStep_ci] = useState_ci(todayEntry ? 'done' : 'mood');
  const [form, setForm_ci] = useState_ci({ mood: 0, sleep: 3, energy: 3, craving: 3, commitment: '' });

  function saveCheckin() {
    if (!form.mood || !form.commitment.trim()) return;
    const entry = { date: today, ts: Date.now(), ...form };
    const next = [entry, ...checkins.filter(c => c.date !== today)].slice(0, 90);
    setCheckins(next);
    localStorage.setItem('vf_checkins', JSON.stringify(next));
    setStep_ci('done');
  }

  // Mini SVG mood chart (last 14 days)
  const chartData = useMemo_ci(() => {
    const days = 14;
    const result = [];
    for (let i = days - 1; i >= 0; i--) {
      const d = new Date(); d.setDate(d.getDate() - i);
      const key = d.toISOString().slice(0, 10);
      const entry = checkins.find(c => c.date === key);
      result.push({ key, mood: entry?.mood || null, date: d });
    }
    return result;
  }, [checkins]);

  const W = 400, H = 100, PAD = 16;
  const pts = chartData.map((d, i) => ({
    x: PAD + (i / (chartData.length - 1)) * (W - PAD * 2),
    y: d.mood ? H - PAD - ((d.mood - 1) / 4) * (H - PAD * 2) : null,
    ...d,
  }));
  const linePts = pts.filter(p => p.y !== null);
  const pathD = linePts.length > 1
    ? linePts.map((p, i) => `${i === 0 ? 'M' : 'L'}${p.x},${p.y}`).join(' ')
    : null;

  // Average mood trend
  const recent7 = checkins.slice(0, 7).filter(c => c.mood);
  const prev7 = checkins.slice(7, 14).filter(c => c.mood);
  const avgR = recent7.length ? (recent7.reduce((a, c) => a + c.mood, 0) / recent7.length).toFixed(1) : null;
  const avgP = prev7.length ? (prev7.reduce((a, c) => a + c.mood, 0) / prev7.length).toFixed(1) : null;
  const trend = avgR && avgP ? (avgR > avgP ? 'up' : avgR < avgP ? 'down' : 'flat') : null;

  const streakDays = (() => {
    let s = 0;
    const today_ = new Date();
    for (let i = 0; i < 90; i++) {
      const d = new Date(today_); d.setDate(d.getDate() - i);
      if (checkins.find(c => c.date === d.toISOString().slice(0, 10))) s++;
      else break;
    }
    return s;
  })();

  if (step === 'done' || todayEntry) {
    return (
      <div style={{ display: 'flex', flexDirection: 'column', gap: 20 }}>
        {/* Today done */}
        <div className="glass" style={{ borderRadius: 18, padding: '22px 24px', borderLeft: '3px solid var(--emerald)' }}>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 12 }}>
            <div>
              <div className="label-sm" style={{ marginBottom: 4 }}>Check-in de hoy</div>
              <div style={{ fontSize: 16, fontWeight: 700 }}>
                {MOOD_EMOJIS[todayEntry?.mood || form.mood]} {MOODS.find(m => m.id === (todayEntry?.mood || form.mood))?.label || '—'}
              </div>
            </div>
            <button className="btn-ghost" onClick={() => setStep_ci('mood')} style={{ padding: '7px 14px', borderRadius: 10, fontSize: 13 }}>
              Editar
            </button>
          </div>
          {todayEntry?.commitment && (
            <div style={{ fontSize: 14, color: 'var(--muted)', fontStyle: 'italic', borderTop: '1px solid rgba(255,255,255,0.06)', paddingTop: 12, marginTop: 4 }}>
              "{todayEntry.commitment}"
            </div>
          )}
        </div>

        {/* Stats row */}
        <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
          {[
            { label: 'Racha de check-ins', value: `${streakDays}d`, color: 'var(--cyan)' },
            { label: 'Humor promedio (7d)', value: avgR ? `${avgR}/5` : '—', color: 'var(--emerald)' },
            { label: 'Tendencia', value: trend === 'up' ? '↑ Mejorando' : trend === 'down' ? '↓ Bajando' : trend === 'flat' ? '→ Estable' : '—', color: trend === 'up' ? '#10b981' : trend === 'down' ? '#ef4444' : 'var(--muted)' },
          ].map(s => (
            <div key={s.label} className="glass" style={{ borderRadius: 12, padding: '14px 16px', flex: '1 1 120px' }}>
              <div className="mono" style={{ fontSize: 20, fontWeight: 700, color: s.color }}>{s.value}</div>
              <div style={{ fontSize: 11, color: 'var(--muted)', marginTop: 2 }}>{s.label}</div>
            </div>
          ))}
        </div>

        {/* Mood chart */}
        {linePts.length > 2 && (
          <div className="glass" style={{ borderRadius: 16, padding: '20px 22px' }}>
            <div className="label-sm" style={{ marginBottom: 14 }}>Evolución del humor — últimas 2 semanas</div>
            <svg viewBox={`0 0 ${W} ${H}`} style={{ width: '100%', height: 'auto', overflow: 'visible' }}>
              {/* Grid lines */}
              {[1,2,3,4,5].map(v => {
                const y = H - PAD - ((v-1)/4)*(H-PAD*2);
                return <line key={v} x1={PAD} y1={y} x2={W-PAD} y2={y} stroke="rgba(255,255,255,0.05)" strokeWidth="1" />;
              })}
              {/* Area fill */}
              {pathD && linePts.length > 1 && (
                <path d={`${pathD} L${linePts[linePts.length-1].x},${H-PAD} L${linePts[0].x},${H-PAD} Z`}
                  fill="url(#moodGrad)" opacity="0.3" />
              )}
              <defs>
                <linearGradient id="moodGrad" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stopColor="#22d3ee" stopOpacity="0.8" />
                  <stop offset="100%" stopColor="#22d3ee" stopOpacity="0" />
                </linearGradient>
              </defs>
              {/* Line */}
              {pathD && <path d={pathD} fill="none" stroke="#22d3ee" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />}
              {/* Dots */}
              {linePts.map((p, i) => (
                <circle key={i} cx={p.x} cy={p.y} r="4" fill="#22d3ee" stroke="#0f172a" strokeWidth="2" />
              ))}
              {/* Empty day markers */}
              {pts.filter(p => p.y === null).map((p, i) => (
                <circle key={i} cx={p.x} cy={H/2} r="2" fill="rgba(255,255,255,0.15)" />
              ))}
            </svg>
            <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 6 }}>
              <span style={{ fontSize: 10, color: 'var(--muted)' }}>Hace 14 días</span>
              <span style={{ fontSize: 10, color: 'var(--muted)' }}>Hoy</span>
            </div>
            <div style={{ marginTop: 12, padding: '12px 14px', borderRadius: 10, background: 'rgba(34,211,238,0.06)', border: '1px solid rgba(34,211,238,0.12)' }}>
              <p style={{ fontSize: 12, color: 'var(--muted)', lineHeight: 1.6 }}>
                <strong style={{ color: 'var(--cyan)' }}>Evidencia:</strong> El estado de ánimo mejora significativamente a partir de la <strong style={{ color: 'var(--text)' }}>semana 2-3</strong> sin nicotina. La irritabilidad y el bajo estado de ánimo son síntomas de abstinencia, no tu personalidad real. — NIDA / Cochrane 2019
              </p>
            </div>
          </div>
        )}

        {/* History */}
        {checkins.length > 1 && (
          <div>
            <div className="label-sm" style={{ marginBottom: 12 }}>Historial reciente</div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
              {checkins.slice(0, 7).map(c => {
                const m = MOODS.find(x => x.id === c.mood);
                const d = new Date(c.date);
                return (
                  <div key={c.date} className="glass" style={{ borderRadius: 12, padding: '12px 16px', display: 'flex', alignItems: 'center', gap: 12 }}>
                    <div style={{ fontSize: 22 }}>{MOOD_EMOJIS[c.mood]}</div>
                    <div style={{ flex: 1 }}>
                      <div style={{ fontSize: 13, fontWeight: 600, color: m?.color }}>{m?.label}</div>
                      {c.commitment && <div style={{ fontSize: 12, color: 'var(--muted)', marginTop: 2 }}>"{c.commitment}"</div>}
                    </div>
                    <div style={{ fontSize: 11, color: 'var(--muted)' }}>{d.toLocaleDateString('es', { weekday: 'short', day: 'numeric', month: 'short' })}</div>
                  </div>
                );
              })}
            </div>
          </div>
        )}
      </div>
    );
  }

  // Check-in form
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 28, maxWidth: 500 }}>
      <div>
        <div className="label-sm" style={{ marginBottom: 6 }}>Ritual matutino</div>
        <h2 style={{ fontSize: 20, fontWeight: 700, marginBottom: 6 }}>Check-in de hoy</h2>
        <p style={{ color: 'var(--muted)', fontSize: 14, lineHeight: 1.6 }}>
          El autoregistro diario es el predictor más fuerte de éxito en la cesación. 2 minutos ahora cambian tu día.
        </p>
      </div>

      {/* Mood */}
      <div>
        <div className="label-sm" style={{ marginBottom: 12 }}>¿Cómo te encuentras hoy?</div>
        <div style={{ display: 'flex', gap: 8 }}>
          {MOODS.map(m => (
            <button key={m.id} onClick={() => setForm_ci(f => ({...f, mood: m.id}))} style={{
              flex: 1, padding: '12px 6px', borderRadius: 12, cursor: 'pointer', transition: 'all .2s',
              background: form.mood === m.id ? `${m.color}18` : 'rgba(255,255,255,0.03)',
              border: `1px solid ${form.mood === m.id ? m.color : 'rgba(255,255,255,0.08)'}`,
              display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6,
            }}>
              <span style={{ fontSize: 24 }}>{MOOD_EMOJIS[m.id]}</span>
              <span style={{ fontSize: 10, color: form.mood === m.id ? m.color : 'var(--muted)', fontWeight: 600 }}>{m.label}</span>
            </button>
          ))}
        </div>
      </div>

      {/* Sliders */}
      {[
        { key: 'sleep',   label: 'Calidad del sueño', lo: 'Muy mal', hi: 'Muy bien' },
        { key: 'energy',  label: 'Nivel de energía',  lo: 'Agotado',  hi: 'Con energía' },
        { key: 'craving', label: 'Intensidad del antojo', lo: 'Sin antojo', hi: 'Muy intenso' },
      ].map(s => (
        <div key={s.key}>
          <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 8 }}>
            <span className="label-sm">{s.label}</span>
            <span className="mono" style={{ fontSize: 13, color: 'var(--cyan)', fontWeight: 700 }}>{form[s.key]}/5</span>
          </div>
          <input type="range" min="1" max="5" value={form[s.key]} onChange={e => setForm_ci(f => ({...f, [s.key]: Number(e.target.value)}))} />
          <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 4 }}>
            <span style={{ fontSize: 10, color: 'var(--muted)' }}>{s.lo}</span>
            <span style={{ fontSize: 10, color: 'var(--muted)' }}>{s.hi}</span>
          </div>
        </div>
      ))}

      {/* Commitment */}
      <div>
        <div className="label-sm" style={{ marginBottom: 8 }}>Mi compromiso de hoy (1 frase)</div>
        <textarea
          value={form.commitment}
          onChange={e => setForm_ci(f => ({...f, commitment: e.target.value}))}
          placeholder="Ej: Hoy, cuando sienta estrés, saldré a caminar 5 minutos..."
          rows={2}
          style={{ width: '100%', padding: '12px 14px', borderRadius: 12, fontSize: 14, resize: 'none', border: '1px solid rgba(255,255,255,0.1)', background: 'rgba(255,255,255,0.04)', color: 'var(--text)', fontFamily: 'Inter,sans-serif', outline: 'none' }}
        />
        <p style={{ fontSize: 11, color: 'var(--muted)', marginTop: 4 }}>
          Verbalizar el compromiso aumenta la adherencia un 40% — Gollwitzer (1999)
        </p>
      </div>

      <button className="btn-primary" onClick={saveCheckin} disabled={!form.mood || !form.commitment.trim()} style={{ padding: '14px 0', borderRadius: 12, fontSize: 15, width: '100%', opacity: (!form.mood || !form.commitment.trim()) ? 0.4 : 1 }}>
        Guardar check-in del día →
      </button>
    </div>
  );
}

const { useState: useState_sx } = React;

// Withdrawal symptoms normalizer
// Evidence: NHS Smokefree, NIDA, DSM-5 nicotine withdrawal criteria

function SymptomsTracker({ symptoms: loggedSymptoms, setSymptoms: setLoggedSymptoms, elapsed }) {
  const [selected, setSelected_sx] = useState_sx(null);

  function toggleSymptom(id) {
    const today = new Date().toISOString().slice(0, 10);
    const entry = { id, date: today, ts: Date.now() };
    const already = loggedSymptoms.find(s => s.id === id && s.date === today);
    let next;
    if (already) {
      next = loggedSymptoms.filter(s => !(s.id === id && s.date === today));
    } else {
      next = [...loggedSymptoms, entry];
    }
    setLoggedSymptoms(next);
    localStorage.setItem('vf_symptoms', JSON.stringify(next));
  }

  const today = new Date().toISOString().slice(0, 10);
  const todayActive = loggedSymptoms.filter(s => s.date === today).map(s => s.id);

  const days = elapsed?.days || 0;

  // Abstinence phase
  let phase = '';
  if (days < 1) phase = 'Fase 1: Primeras horas — la nicotina sale de tu sangre';
  else if (days < 4) phase = 'Fase 2: Peak de abstinencia — el momento más duro, y pasa';
  else if (days < 14) phase = 'Fase 3: Recuperación activa — cada día mejora algo';
  else if (days < 30) phase = 'Fase 4: Estabilización — el cerebro se recalibra';
  else phase = 'Fase 5: Nueva normalidad — has superado lo más difícil';

  return (
    <div>
      {/* Phase banner */}
      <div className="glass" style={{ borderRadius: 16, padding: '18px 22px', marginBottom: 22, borderLeft: '3px solid var(--cyan)', background: 'rgba(34,211,238,0.04)' }}>
        <div className="label-sm" style={{ marginBottom: 4 }}>Día {days} — {phase}</div>
        <p style={{ fontSize: 13, color: 'var(--muted)', lineHeight: 1.6 }}>
          Cada síntoma que sientes es una señal de que tu cuerpo está <strong style={{ color: 'var(--text)' }}>reparándose activamente</strong>. No son castigos, son procesos de curación.
        </p>
      </div>

      {/* Today's symptoms */}
      <div className="label-sm" style={{ marginBottom: 12 }}>¿Qué síntomas tienes hoy? (marca todos los que aplican)</div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 8, marginBottom: 24 }}>
        {SYMPTOMS.map(s => {
          const active = todayActive.includes(s.id);
          const expanded = selected === s.id;
          return (
            <div key={s.id}>
              <div
                className="glass"
                style={{
                  borderRadius: 14, padding: '14px 16px', cursor: 'pointer',
                  border: `1px solid ${active ? s.color + '40' : 'rgba(255,255,255,0.07)'}`,
                  background: active ? `${s.color}08` : 'rgba(255,255,255,0.02)',
                  transition: 'all .2s',
                }}
              >
                <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                  {/* Checkbox */}
                  <button onClick={() => toggleSymptom(s.id)} style={{
                    width: 22, height: 22, borderRadius: 6, flexShrink: 0,
                    border: `2px solid ${active ? s.color : 'rgba(255,255,255,0.2)'}`,
                    background: active ? s.color : 'transparent',
                    display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer',
                    transition: 'all .2s',
                  }}>
                    {active && <Icon name="check-circle" size={12} color="#0f172a" />}
                  </button>
                  <Icon name={s.icon} size={16} color={active ? s.color : 'var(--muted)'} />
                  <span style={{ flex: 1, fontSize: 14, fontWeight: active ? 600 : 400, color: active ? 'var(--text)' : 'var(--muted)' }}>{s.label}</span>
                  <div style={{ textAlign: 'right', flexShrink: 0 }}>
                    <div style={{ fontSize: 10, color: 'var(--muted)' }}>Pico: {s.peak}</div>
                    <div style={{ fontSize: 10, color: 'var(--muted)' }}>Dura: {s.duration}</div>
                  </div>
                  <button onClick={() => setSelected_sx(expanded ? null : s.id)} style={{ background: 'none', border: 'none', cursor: 'pointer', color: 'var(--muted)', display: 'flex', alignItems: 'center' }}>
                    <Icon name={expanded ? 'chevron-down' : 'chevron-right'} size={14} />
                  </button>
                </div>
              </div>
              {expanded && (
                <div style={{ marginLeft: 16, marginTop: 4, padding: '14px 18px', borderRadius: 12, background: 'rgba(255,255,255,0.03)', borderLeft: `2px solid ${s.color}50` }}>
                  <p style={{ fontSize: 13, color: 'var(--text)', lineHeight: 1.7, marginBottom: 10 }}>{s.explanation}</p>
                  <div style={{ padding: '10px 12px', borderRadius: 9, background: `${s.color}0e`, border: `1px solid ${s.color}25` }}>
                    <div style={{ fontSize: 11, color: s.color, fontWeight: 700, marginBottom: 4, textTransform: 'uppercase', letterSpacing: '0.07em' }}>Qué hacer ahora</div>
                    <p style={{ fontSize: 12, color: 'var(--muted)', lineHeight: 1.6 }}>{s.tip}</p>
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>

      {todayActive.length > 0 && (
        <div className="glass" style={{ borderRadius: 14, padding: '16px 18px', borderLeft: '3px solid var(--emerald)' }}>
          <div style={{ fontSize: 13, color: 'var(--emerald)', fontWeight: 700, marginBottom: 4 }}>
            {todayActive.length} síntoma{todayActive.length > 1 ? 's' : ''} registrado{todayActive.length > 1 ? 's' : ''} hoy
          </div>
          <p style={{ fontSize: 13, color: 'var(--muted)', lineHeight: 1.6 }}>
            Registrar síntomas sin juzgarlos es la base de la Terapia de Aceptación y Compromiso (ACT). Los síntomas son información, no señales para volver a vapear.
          </p>
        </div>
      )}
    </div>
  );
}

    ...SOS_TECHNIQUES,
    { id: 'cbt', label: 'Registro de pensamiento CBT', desc: 'Identifica y reformula el pensamiento que dispara el antojo. Aaron Beck.', icon: 'brain', color: '#a78bfa', source: 'CBT — Aaron Beck / Cochrane 2019' },

  if (selected === 'cbt') return <CBTThoughtRecord onBack={() => setSelected_esos(null)} />;
  if (selected) {
    // Delegate to original SOSHub internals via a little proxy
    return <SOSHubInner selected={selected} onBack={() => setSelected_esos(null)} onComplete={onComplete} />;
  }

  return (
    <div>
      <div style={{ marginBottom: 22 }}>
        <div className="label-sm" style={{ marginBottom: 6 }}>6 técnicas basadas en evidencia</div>
        <h2 style={{ fontSize: 20, fontWeight: 800, marginBottom: 6 }}>Kit de Supervivencia SOS</h2>
        <p style={{ color: 'var(--muted)', fontSize: 14, lineHeight: 1.6 }}>

          Los antojos duran <strong style={{ color: 'var(--text)' }}>3–5 minutos</strong>. Solo eso.
        </p>
      </div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
        {ALL_TECHNIQUES.map(t => (
          <button key={t.id} onClick={() => setSelected_esos(t.id)} style={{
            display: 'flex', alignItems: 'center', gap: 16, padding: '18px 20px', borderRadius: 16,
            background: 'rgba(255,255,255,0.03)', border: '1px solid rgba(255,255,255,0.08)',
            cursor: 'pointer', textAlign: 'left', color: 'var(--text)', fontFamily: 'Inter,sans-serif',
            transition: 'all .2s',
          }}
            onMouseEnter={e => { e.currentTarget.style.background = `${t.color}0c`; e.currentTarget.style.borderColor = `${t.color}35`; }}
            onMouseLeave={e => { e.currentTarget.style.background = 'rgba(255,255,255,0.03)'; e.currentTarget.style.borderColor = 'rgba(255,255,255,0.08)'; }}
          >
            <div style={{ width: 50, height: 50, borderRadius: 14, background: `${t.color}18`, border: `1px solid ${t.color}30`, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
              <Icon name={t.icon} size={24} color={t.color} />
            </div>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 15, fontWeight: 700, marginBottom: 3 }}>{t.label}</div>
              <div style={{ fontSize: 12, color: 'var(--muted)', lineHeight: 1.5 }}>{t.desc}</div>
              <div style={{ fontSize: 10, color: t.color, marginTop: 4, fontWeight: 600 }}>{t.source}</div>
            </div>
            <Icon name="chevron-right" size={16} color="var(--muted)" />
          </button>
        ))}
      </div>
    </div>
  );
}

// Proxy to render individual SOS technique without duplicating code
function SOSHubInner({ selected, onBack, onComplete }) {
  // Re-use SOSHub but simulate having selected a technique
  // We wrap SOSHub's inner techniques
  const techMap = {
    breathing: BreathingTechnique,
    grounding: GroundingTechnique,
    coldwater: ColdWaterTechnique,
    urgesurfing: UrgeSurfingTechnique,
    movement: MovementTechnique,
  };
  const t = SOS_TECHNIQUES.find(x => x.id === selected);
  const Comp = techMap[selected];
  if (!Comp) return null;
  return (
    <div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 28 }}>
        <button className="btn-ghost icon-btn" onClick={onBack}><Icon name="arrow-left" size={18} /></button>
        <h3 style={{ fontSize: 18, fontWeight: 700 }}>{t?.label}</h3>
        <button className="btn-primary" onClick={onComplete} style={{ marginLeft: 'auto', padding: '7px 16px', borderRadius: 10, fontSize: 13 }}>
          Registrar antojo
        </button>
      </div>
      <Comp />
    </div>
  );
}

// ── Achievement Toast ────────────────────────────────────────────────────────
function AchievementToast({ achievement, onClose }) {
  useEffect(() => {
    const id = setTimeout(onClose, 4500);
    return () => clearTimeout(id);
  }, []);
  if (!achievement) return null;
  return (
    <div style={{
      position: 'fixed', top: 20, left: '50%', transform: 'translateX(-50%)',
      zIndex: 999, animation: 'badge-pop .4s ease',
      maxWidth: 340, width: '90%',
    }}>
      <div className="glass" style={{
        borderRadius: 16, padding: '16px 20px', display: 'flex', alignItems: 'center', gap: 14,
        border: `1px solid ${achievement.color}40`, background: `${achievement.color}0e`,
        boxShadow: `0 8px 40px ${achievement.color}30`,
      }}>
        <div style={{ width: 44, height: 44, borderRadius: 12, background: `${achievement.color}25`, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
          <Icon name={achievement.icon} size={22} color={achievement.color} />
        </div>
        <div style={{ flex: 1 }}>
          <div style={{ fontSize: 11, color: achievement.color, fontWeight: 800, textTransform: 'uppercase', letterSpacing: '0.08em', marginBottom: 2 }}>¡Logro desbloqueado!</div>
          <div style={{ fontSize: 15, fontWeight: 700 }}>{achievement.label}</div>
        </div>
        <button onClick={onClose} style={{ background: 'none', border: 'none', cursor: 'pointer', color: 'var(--muted)', display: 'flex' }}>
          <Icon name="x" size={14} />
        </button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
